# Stage 1, single Z, 3 visual environments x 40 frictions.
# Steps 1-800: model-only training on one fixed middle-friction group per
# environment (groups 14, 59, 104). Every chunk independently borrows one of
# the six frozen random initial Z vectors.
# The initial active set has two groups per environment: the fixed middle group
# plus one OS-random draw from either the lowest-five or highest-five friction
# tail. The three side choices must cover both tails.
# Steps 801-1000: permanently assign the six Z vectors and train the model only.
# From step 1001, use the normal 1000-step alternating curriculum. Newly active
# groups receive Z-only lr=0.9 for their first 200 steps; other Z phases retain
# lr=0.3. Later rounds add two groups per environment (six total).
dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox_various_env/libero_plus_push_box_event_tap_segmented40_10action_3env_hidden_lerobot_A500_offset160_stop_2026-07-27_hai-machine"
