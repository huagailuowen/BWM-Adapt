dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox_various_env/libero_plus_push_box_event80_matched_physics_30background_pool_30friction_10action_random5per_pair_1500eps_adaptive_end_2026-09-03_hai-machine"
  dataset_metadata_path: "data/push_box_matchedphysics30bg_uniform20fric_10action_65_105_shared_20260903/train.jsonl"
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: "video,action"
video:
  height: 224
  width: 224
  max_pixels: 16777216
  num_frames: 41
  resize_mode: "fit"
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: "static"
  pad_short_chunks: true
model:
  model_paths: "models/Wan2.2-TI2V-5B"
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: "configs/model/wan2_2_ti2v_5b.yaml"
  initialize_model_on_cpu: false
  text_mode: "none"
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: "adaln"
action:
  action_type: "eef_delta"
  action_stat_path: "data/push_box_matchedphysics30bg_uniform20fric_10action_65_105_shared_20260903/action_stats.json"
  action_dim: 14
physical_context:
  physical_context_mode: "none"
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 0
  physical_context_init_std: 0.0
  physical_adapter_mode: "none"
ttt_kvb:
  ttt_active_environment_manifest: "configs/methods/pushbox_multibackground/manifests/matchedphysics30bg_uniform20.yaml"
  ttt_environment_key: "context_group_id"
  ttt_action_key: "action_id"
  ttt_distinct_actions: true
  ttt_sequence_length: 6
  # Match the established TTT setup: two three-chunk backward segments while
  # carrying the detached numerical fast state into the second segment.
  ttt_detach_every_chunks: 3
  ttt_environments_per_rank: 4
  ttt_layers: "uniform:8"
  ttt_expansion: 4
  ttt_base_inner_lr: 0.1
  ttt_inner_batch_size: 64
  ttt_write_token_budget: 0
  ttt_gate_init: 0.1
  ttt_gate_vector: true
  ttt_serial_after_attention: true
  ttt_saved_tensor_cpu_offload: false
  ttt_saved_tensor_policy: "selective"
  ttt_scan_checkpoint_updates: 8
  ttt_gpu_saved_tensor_budget_gib: 64.0
  ttt_host_saved_tensor_budget_gib: 24.0
  ttt_pin_saved_tensor_memory: false
  ttt_backward_per_stream: true
  ttt_sync_per_update: true
  ttt_protocol: "oneminute_write_then_predict"
  ttt_slow_learning_rate: 1e-4
  ttt_max_updates: 50000
training:
  learning_rate: 1e-5
  stage1_warmup_steps: 100
  num_epochs: 100000
  trainable_models: "dit,action_encoder"
  find_unused_parameters: true
  weight_decay: 0.01
  task: "sft"
  seed: 20260903
  mixed_precision: "bf16"
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 1
  spatial_loss_mode: "fixed_polygon"
  spatial_loss_roi_weight: 10.0
  spatial_loss_roi_view_indices: "0"
  spatial_loss_roi_source_width: 224
  spatial_loss_roi_source_height: 224
  spatial_loss_roi_polygon: "94,92;142,92;154,224;78,224"
output:
  output_path: "./outputs/method_benchmarks/pushbox_matchedphysics30bg_active20/ttt_kqv_prequential6_roi10x/__JOB_ID__/checkpoints"
  remove_prefix_in_ckpt: "pipe.dit."
  save_steps: 200
  checkpoint_save_minutes: 60
  checkpoint_keep_last: 2
  log_steps: 2
  ckpt_path: "ckpt/BLM/step-12000.safetensors"
  resume_from: null
lora:
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null
gradient:
  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5
tracking:
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
