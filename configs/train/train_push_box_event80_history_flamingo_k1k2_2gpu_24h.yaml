# Flamingo-style in-context baseline on the exact Event80 active-35 set used by
# Ours 88823/step7272. Each rank samples one environment and six unique actions;
# K is randomly 1 or 2 and all remaining actions are disjoint read-only queries.

dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox/libero_push_box_event_tap_segmented80_10action_hidden_lerobot_A500_offset160_stop_2026-07-05_hai-machine"
  dataset_metadata_path: "data/push_box_bwm_event_tap_segmented80_10action_A500_offset160_stop_65_105_20260705/train.jsonl"
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: "video,action"

video:
  height: 224
  width: 224
  max_pixels: 16777216
  num_frames: 41
  resize_mode: "fit"
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: "static"
  pad_short_chunks: true

model:
  model_paths: "models/Wan2.2-TI2V-5B"
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: "configs/model/wan2_2_ti2v_5b.yaml"
  initialize_model_on_cpu: false
  text_mode: "none"
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: "adaln"

action:
  action_type: "eef_delta"
  action_stat_path: "data/push_box_bwm_event_tap_segmented80_10action_A500_offset160_stop_65_105_20260705/action_stats.json"
  action_dim: 14

physical_context:
  physical_context_mode: "none"
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0.0
  physical_context_init_value: 0.5
  physical_context_input_norm: "layernorm"
  physical_adapter_mode: "none"
  physical_adapter_rank: 16
  physical_adapter_layers: "all"
  physical_adapter_gate_init: 0.0

flamingo_history_context:
  history_dinov2_model_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/checkpoints/dinov2-base"
  history_active_environment_manifest: "configs/methods/event80/manifests/ours_88823_step7272_active35.yaml"
  history_support_sizes: "1,2"
  history_chunks_per_environment: 6
  history_environments_per_rank: 1
  history_sampled_frames: 8
  history_memory_dim: 1536
  history_num_latents: 64
  history_resampler_layers: 6
  history_heads: 16
  history_insertion_frequency: 4
  history_module_learning_rate: 1.0e-4
  history_gate_learning_rate: 1.0e-3
  history_max_updates: 50000

training:
  learning_rate: 0.0
  stage1_warmup_steps: 100
  num_epochs: 1
  trainable_models: "dit,action_encoder"
  find_unused_parameters: true
  weight_decay: 0.0
  task: "sft"
  seed: 20260708
  mixed_precision: "bf16"
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 1

output:
  output_path: "./outputs/method_benchmarks/pushbox_friction_event80/history_conditioned_wm/flamingo_k1k2_seed_20260708/checkpoints"
  remove_prefix_in_ckpt: null
  save_steps: 200
  checkpoint_save_minutes: 60
  checkpoint_keep_last: 2
  log_steps: 2
  ckpt_path: "ckpt/BLM/step-12000.safetensors"
  resume_from: null

lora:
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null

gradient:
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5

tracking:
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
