# Correct 1400-step cycle with stable context rates: all-C LR 0.03 and newly-added-C LR 0.09; agent ROI remains 10x.
# ROI-weighted counterpart of the matched-physics 5-background Stage1 run.
# All training and curriculum settings match the unweighted baseline. Only the
# agent-camera push corridor receives 10x relative flow-matching weight; the
# rest of the agent view and the complete wrist view remain at 1x. The full
# spatial weight tensor is normalized to mean 1 before the MSE reduction.

dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox_various_env/libero_plus_push_box_event80_matched_physics_5randombackground_30friction_10action_1500eps_adaptive_end_2026-08-19_hai-machine"
  dataset_metadata_path: "data/push_box_bwm_matchedphysics5bg30fric10action_65_105_shared_friction30_20260819/train.jsonl"
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: "video,action"

video:
  height: 224
  width: 224
  max_pixels: 16777216
  num_frames: 41
  resize_mode: "fit"
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: "static"
  pad_short_chunks: true

model:
  model_paths: "models/Wan2.2-TI2V-5B"
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: "configs/model/wan2_2_ti2v_5b.yaml"
  initialize_model_on_cpu: false
  text_mode: "none"
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: "adaln"

action:
  action_type: "eef_delta"
  action_stat_path: "data/push_box_bwm_matchedphysics5bg30fric10action_65_105_shared_friction30_20260819/action_stats.json"
  action_dim: 14

physical_context:
  physical_context_mode: "both"
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0.0
  physical_context_init_value: 0.5
  physical_adapter_mode: "none"
  physical_adapter_rank: 16
  physical_adapter_layers: "all"
  physical_adapter_gate_init: 0.0

grouped_context_stage1:
  grouped_context_init_mode: "uniform"
  grouped_context_init_value: 0.5
  grouped_context_init_std: 0.0
  grouped_context_init_min: 0.0
  grouped_context_init_max: 1.0
  grouped_context_clamp_min: 0.0
  grouped_context_clamp_max: 1.0
  grouped_context_lr: 0.03
  grouped_context_new_context_lr: 0.09
  grouped_context_mid_context_lr: 0.09
  grouped_context_model_lr_warmup_steps: 100
  grouped_context_weight_decay: 0.0
  grouped_context_structured_updates: 8700
  grouped_context_sampling_mode: "common_actions"
  grouped_context_sampling_strata: 1
  grouped_context_friction_groups_per_update: 3
  grouped_context_actions_per_update: 6
  grouped_context_microbatches_per_update: 18
  grouped_context_curriculum_variant: "original_1000_plus_c_model"
  grouped_context_curriculum_initial_groups: 5
  grouped_context_curriculum_warmup_groups: 5
  grouped_context_curriculum_add_groups: 5
  grouped_context_curriculum_total_groups: 30
  grouped_context_curriculum_strata: 1
  grouped_context_curriculum_initial_model_steps: 300
  grouped_context_curriculum_assignment_model_steps: 0
  grouped_context_curriculum_random_context_warmup: false
  grouped_context_curriculum_new_context_steps: 200
  grouped_context_curriculum_mid_context_steps: 200
  grouped_context_curriculum_all_context_steps: 200
  grouped_context_curriculum_model_steps: 200
  grouped_context_post_curriculum_cycle_steps: 200
  grouped_context_protected_checkpoint_steps: "4500"
  grouped_context_resume_context_table: null
  grouped_context_resume_step: 0

training:
  learning_rate: 1e-5
  num_epochs: 1
  trainable_models: "dit,action_encoder,physical_context_encoder"
  find_unused_parameters: true
  weight_decay: 0.01
  task: "sft"
  seed: 20260819
  mixed_precision: "bf16"
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 1
  spatial_loss_mode: "fixed_polygon"
  spatial_loss_roi_weight: 10.0
  spatial_loss_roi_view_indices: "0"
  spatial_loss_roi_source_width: 224
  spatial_loss_roi_source_height: 224
  spatial_loss_roi_polygon: "94,92;142,92;154,224;78,224"

output:
  output_path: "./outputs/push_box_matchedphysics5bg30fric_shared_c32_random_roi10x_agent_original1000_tailc200m200_alllr003_newlr009_model300_3fric6action_stage1_8700"
  remove_prefix_in_ckpt: "pipe.dit."
  save_steps: 100
  checkpoint_save_minutes: 0
  checkpoint_keep_last: 2
  log_steps: 10
  ckpt_path: "ckpt/BLM/step-12000.safetensors"
  resume_from: null

lora:
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null

gradient:
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5

tracking:
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
