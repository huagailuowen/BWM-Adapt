# Continuation after the 1200-step direct-random-C32 pretraining run.
# The source model and model optimizer moments are loaded read-only. A fresh
# 30-entry environment C32 table is created in this run's independent output.
# Steps 1-200: six initial environment C values are fixed; train model only.
# Then run five 1000-step cycles, adding six environments per cycle:
# new-C 200, all-C 200, model 200, all-C 200, model 200.

dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox_various_env/libero_plus_push_box_event_tap_segmented40_10action_3env_hidden_lerobot_A500_offset160_stop_2026-07-27_hai-machine"
  dataset_metadata_path: "data/push_box_bwm_various_env3x40_10action_65_105_20260727/train.jsonl"
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: "video,action"

video:
  height: 224
  width: 224
  max_pixels: 16777216
  num_frames: 41
  resize_mode: "fit"
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: "static"
  pad_short_chunks: true

model:
  model_paths: "models/Wan2.2-TI2V-5B"
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: "configs/model/wan2_2_ti2v_5b.yaml"
  initialize_model_on_cpu: false
  text_mode: "none"
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: "adaln"

action:
  action_type: "eef_delta"
  action_stat_path: "data/push_box_bwm_various_env3x40_10action_65_105_20260727/action_stats.json"
  action_dim: 14

physical_context:
  physical_context_mode: both
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0.0
  physical_context_init_value: 0.5
  physical_adapter_mode: "none"
  physical_adapter_rank: 16
  physical_adapter_layers: "all"
  physical_adapter_gate_init: 0.0

grouped_context_stage1:
  grouped_context_init_mode: uniform
  grouped_context_init_value: 0.5
  grouped_context_init_std: 0.0
  grouped_context_init_min: 0.0
  grouped_context_init_max: 1.0
  grouped_context_clamp_min: 0.0
  grouped_context_clamp_max: 1.0
  grouped_context_lr: 0.3
  grouped_context_new_context_lr: 0.9
  grouped_context_mid_context_lr: 0.3
  grouped_context_model_lr_warmup_steps: 0
  grouped_context_weight_decay: 0.0
  grouped_context_structured_updates: 20200
  grouped_context_sampling_mode: stratified_common_actions
  grouped_context_stratify_field: environment_index
  grouped_context_sampling_strata: 3
  grouped_context_friction_groups_per_update: 3
  grouped_context_actions_per_update: 6
  grouped_context_microbatches_per_update: 18
  grouped_context_curriculum_initial_groups: 6
  grouped_context_curriculum_warmup_groups: 6
  grouped_context_curriculum_add_groups: 6
  grouped_context_curriculum_total_groups: 120
  grouped_context_curriculum_strata: 3
  grouped_context_curriculum_initial_model_steps: 0
  grouped_context_curriculum_assignment_model_steps: 200
  grouped_context_curriculum_initial_sample_mode: all
  grouped_context_curriculum_random_context_warmup: false
  grouped_context_curriculum_shared_initial_friction: false
  grouped_context_curriculum_new_context_steps: 200
  grouped_context_curriculum_all_context_steps: 200
  grouped_context_curriculum_model_steps: 200
  grouped_context_curriculum_variant: default
  grouped_context_resume_context_table: null
  grouped_context_resume_step: 0
  grouped_context_initialize_optimizer_state: null
  grouped_context_stage_checkpoints_locally: true
  grouped_context_local_checkpoint_root: null
  grouped_context_model_phase_checkpoint_policy: cycle_end

training:
  learning_rate: 1.0e-5
  num_epochs: 1
  trainable_models: dit,action_encoder,physical_context_encoder
  find_unused_parameters: true
  weight_decay: 0.01
  task: "sft"
  seed: 20260805
  mixed_precision: "bf16"
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 1

output:
  output_path: outputs/push_box_various_env3x40_10action_65_105_from_directrandom30bg1200_initial6_assign200_add6_newlr09_stage1_20200
  remove_prefix_in_ckpt: "pipe.dit."
  save_steps: 1000000
  checkpoint_save_minutes: 0
  checkpoint_keep_last: 2
  log_steps: 10
  ckpt_path: /path/to/read_only_direct_random_step-1200.safetensors
  resume_from: null

lora:
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null

gradient:
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5

tracking:
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
