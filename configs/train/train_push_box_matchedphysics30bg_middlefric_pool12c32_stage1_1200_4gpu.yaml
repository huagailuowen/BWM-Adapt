# Fixed-pool variant: every sample draws uniformly from 12 immutable random C32 values.
# Stage 1 feasibility run on the middle physical friction only (mu=0.10).
# Every optimizer update samples 18 arbitrary episodes per GPU, independently
# and uniformly with replacement. Every sample receives a fresh C32 ~ U(0, 1).
# The context table is not used or trained in this mode.

dataset:
  dataset_base_path: "/afs/ir/users/c/y/cyzhou05/TTT-Physics/datasets/pushbox_various_env/libero_plus_push_box_event80_matched_physics_30background_3friction_10action_900eps_lerobot_2026-08-05_hai-machine"
  dataset_metadata_path: "data/push_box_bwm_matchedphysics30bg_middlefric_65_105_20260805/train.jsonl"
  dataset_repeat: 1
  dataset_num_workers: 0
  data_file_keys: "video,action"

video:
  height: 224
  width: 224
  max_pixels: 16777216
  num_frames: 41
  resize_mode: "fit"
  num_history_frames: 1
  time_division_factor: 4
  time_division_remainder: 1
  spatial_division_factor: 32
  chunk_mode: "static"
  pad_short_chunks: true

model:
  model_paths: "models/Wan2.2-TI2V-5B"
  model_id_with_origin_paths: null
  extra_inputs: null
  fp8_models: null
  offload_models: null
  model_config_path: "configs/model/wan2_2_ti2v_5b.yaml"
  initialize_model_on_cpu: false
  text_mode: "none"
  enable_text: false
  enable_dit: true
  enable_vae: true
  enable_image: false
  action_mode: "adaln"

action:
  action_type: "eef_delta"
  action_stat_path: "data/push_box_bwm_matchedphysics30bg_middlefric_65_105_20260805/action_stats.json"
  action_dim: 14

physical_context:
  physical_context_mode: both
  physical_context_dim: 32
  physical_context_tokens: 1
  physical_context_hidden_dim: 128
  physical_context_init_std: 0.0
  physical_context_init_value: 0.5
  physical_adapter_mode: "none"
  physical_adapter_rank: 16
  physical_adapter_layers: "all"
  physical_adapter_gate_init: 0.0

grouped_context_stage1:
  grouped_context_init_mode: fixed
  grouped_context_init_value: 0.5
  grouped_context_init_std: 0.0
  grouped_context_init_min: 0.0
  grouped_context_init_max: 1.0
  grouped_context_clamp_min: 0.0
  grouped_context_clamp_max: 1.0
  grouped_context_lr: 0.0
  grouped_context_weight_decay: 0.0
  grouped_context_structured_updates: 0
  grouped_context_curriculum_initial_groups: 0
  grouped_context_model_lr_warmup_steps: 100
  grouped_context_direct_random_steps: 1200
  grouped_context_direct_random_min: 0.0
  grouped_context_direct_random_max: 1.0
  grouped_context_direct_random_pool_size: 12
  grouped_context_direct_random_resume_state: null
  grouped_context_direct_random_local_checkpoint_root: null

training:
  learning_rate: 1.0e-5
  num_epochs: 1
  trainable_models: dit,action_encoder,physical_context_encoder
  find_unused_parameters: true
  weight_decay: 0.01
  task: "sft"
  seed: 20260805
  mixed_precision: "bf16"
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  batch_size: 18

output:
  output_path: outputs/push_box_matchedphysics30bg_middlefric_pool12c32_stage1_1200
  remove_prefix_in_ckpt: "pipe.dit."
  save_steps: 400
  checkpoint_save_minutes: 0
  checkpoint_keep_last: 0
  log_steps: 10
  ckpt_path: /hai/scratch/cyzhou05/projects/TTT-Physics/repos/BWM-Adapt/ckpt/BLM/step-12000.safetensors
  resume_from: null

lora:
  lora_base_model: null
  lora_target_modules: null
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null

gradient:
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  gradient_accumulation_steps: 1
  max_grad_norm: 0.5

tracking:
  use_wandb: false
  use_swanlab: false
  swanlab_experiment_name: null
