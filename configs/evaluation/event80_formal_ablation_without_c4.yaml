notes:
- Existing reported metrics are reused; no video generation or metric recomputation.
- Blank metric cells mean unavailable or pending, never zero.
- Historical initialization runs retain their recorded training schedules and are
  not claimed to be strict single-variable controls.
- C4 and direct-token jobs use two GPUs, 4 environments x 4 actions per rank, the
  intended original active35 pool, and the 1000-step alternating curriculum.
- The evaluated C4 checkpoint is step6300 with 30 actually active environments; direct-token
  step7700 and reference C32 step7272 use 35. C4 is not a strict dimension-only comparison
  at matched active-environment count.
- The 1000-step pure-joint variant, C1, C128, new-C200/joint800, shuffled groups,
  and per-trajectory codes are not selected for this formal table.
