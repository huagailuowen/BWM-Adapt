version: 1
analysis_status: exploratory_post_hoc
candidate_protocol_config: configs/evaluation/action_tasks/mass_friction_target_precision_v1.yaml
output_dir: results/mass_friction/joint100_grid_id5_ood5_k1_oracle_informative_support25_60_v1/metrics/action_first_crossing_v1
object_index: 0
coordinate: terminal_y_normalized
comparison: strictly_greater
selectors: [raw_first_crossing, isotonic_first_crossing]
