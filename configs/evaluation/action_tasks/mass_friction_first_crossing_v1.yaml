threshold_sets:
  original_target_lines: [0.62, 0.75, 0.92]
  uniform_target_lines: [0.600, 0.625, 0.650, 0.675, 0.700, 0.725, 0.750, 0.775, 0.800, 0.825, 0.850, 0.875, 0.900, 0.925, 0.950]
score_by_absolute_rank_error: {0: 1.0, 1: 0.5}
other_rank_error_score: 0.0
prediction_never_crosses_score: 0.0
missing_crossing_rank_error: maximum_action_rank_gap
aggregation: equal_threshold_weight_then_equal_reachable_environment_weight
preserve_formal_results: true
