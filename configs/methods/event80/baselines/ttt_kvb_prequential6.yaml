extends: ../common.yaml

experiment:
  id: ttt_kvb_prequential6

method:
  slug: ttt_kqv
  canonical_name: TTT-KVB
  compatibility_alias: TTT-KQV
  family: baseline
  training_protocol: prequential_read_then_write
  training_sequence_length: 6
  training_support_query_partition: none
  query_write: false
  reset_per_environment: true
  outer_query_loss: flow_matching_at_all_six_prefix_lengths
  support_backbone_gradient: false
  differentiate_through_writes: true
  insertion:
    topology: parallel_gated_branch
    layers: uniform:8
    gate_init: 0.01
    preserve_local_wan_attention: true
  fast_weight:
    model: two_layer_gelu_mlp
    expansion: 4
    qkv_views: independent_learned
    binding_loss: mse
    base_inner_lr: 0.1
    optimizer: minibatch_gradient_descent
    precision: fp32
    state_normalization: none
  support_write:
    timing: after_current_chunk_prediction
    token_selection: uniform_over_flattened_video_tokens
    token_budget_per_trajectory: 512
    inner_batch_size: 64
    updates_per_chunk: 8
    updates_per_six_chunk_stream: 48
    checkpointing: false
  query_read:
    state_frozen_during_prediction: true
    current_chunk_cannot_update_its_own_prediction: true
    checkpointing: true

training:
  model_learning_rate: 1.0e-5
  ttt_slow_parameter_learning_rate: 1.0e-4
  warmup_steps: 100

execution:
  training:
    mode: independent
    ready: true
    blocked_by: null
  inference:
    ready: false
    blocked_by: wan_support_query_batch_binding

runtime:
  implementation_status: practical_prequential_training_ready
  train_entrypoint: scripts/methods/train_ttt_kvb_event80.py
  legacy_train_config: configs/train/train_push_box_event80_ttt_kvb_prequential6_2gpu_24h.yaml
