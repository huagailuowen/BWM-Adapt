extends: ../common.yaml

experiment:
  id: history_conditioned_wm

method:
  slug: history_conditioned_wm
  family: baseline
  architecture: flamingo_perceiver_gated_cross_attention
  history_window_frames: 41
  support_sizes: [1, 2]
  support_query_disjoint: true
  support_order_randomized: true
  memory_tokens: 64
  memory_dim: 1536
  sampled_support_frames: 8
  perceiver_layers: 6
  attention_heads: 16
  gated_xattn_insertion_frequency: 4
  zero_initialized_cross_attention_gate: true
  zero_initialized_dense_gate: true
  trajectory_segment_embeddings: true
  local_temporal_positions_reset_per_support: true
  complete_interframe_action_chunks: true
  frozen_dinov2_backbone: true
  frozen_wan_backbone: true
  environment_latent: false

adaptation:
  enabled: true
  mode: read_only_support_memory
  query_writes_memory: false

execution:
  training:
    mode: grouped_support_query
    ready: true
    runner: scripts/methods/train_history_conditioned_event80.py
  inference:
    ready: false
    blocked_by: flamingo_history_inference_runner

runtime:
  implementation_status: training_ready
  protocol_runner: wan_video_action.methods.baselines.history_conditioned
