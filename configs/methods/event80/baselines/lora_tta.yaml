    ready: true
    blocked_by: null
  dependencies: [standard_pooled_wm]

runtime:
  implementation_status: event80_support_query_runner_ready
  protocol_runner: wan_video_action.methods.baselines.lora_tta
  infer:
    entrypoint: scripts/methods/infer_lora_tta_event80.py
