<text x="55" y="748" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">ADE / FDE: pixels. Each metric keeps its existing task-specific protocol; rows are not averaged across tasks.</text>
<text x="55" y="782" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">Door action: preferred adjacent-level overlap (9 eligible environments); Ball: first-reach successor overlap (8).</text>
<text x="55" y="816" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">Stick action: fixed 36-query seed20260927 subset; new model selects 6, with 5 truly balanced (83.33%).</text>
<text x="55" y="850" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">Stick image / ADE: all 45 test queries; FDE: 33 valid old queries versus 36 new, not an identical valid subset.</text>
<text x="55" y="884" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">Soft: shared 6 environments / 12 test queries; action is onset Success@6 degrees on 11 GT-positive queries.</text>
<text x="55" y="918" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">The Stick subset and Soft 6-degree threshold were previously chosen post hoc; those choices remain unchanged.</text>
<text x="55" y="952" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">This is not LR-only: official Door / Ball are nondual; the new runs use dual6500 and different initialization.</text>
<text x="55" y="986" text-anchor="start" font-family="DejaVu Serif, serif" font-size="20" font-weight="400" fill="#444444">Automatic tracking, pending new visual audit. Blue shading identifies the new variant, not the winning score.</text>
</svg>
